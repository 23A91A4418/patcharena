<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PatchArena — AI Patch Competition</title>
  <meta name="description" content="AI patch competition on Celesto sandboxes. Multiple AI agents compete to fix your GitHub issues in parallel." />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body class="bg-[#0a0b0f] text-gray-100 font-['Inter'] min-h-screen">

  <!-- Header -->
  <header class="border-b border-white/5 bg-[#0d0f18]/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-gradient-to-br from-violet-500 to-indigo-600 rounded-lg flex items-center justify-center text-white font-black text-sm">P</div>
        <span class="font-bold text-white text-lg tracking-tight">PatchArena</span>
        <span class="text-xs text-gray-500 font-medium bg-white/5 px-2 py-0.5 rounded-full">on Celesto</span>
      </div>
      <div class="flex items-center gap-3">
        <label class="flex items-center gap-2 text-sm text-gray-400 cursor-pointer">
          <input type="checkbox" id="replayToggle" class="w-4 h-4 accent-violet-500" />
          <span>Replay mode</span>
        </label>
        <button id="pauseBtn" class="hidden px-3 py-1.5 text-xs font-medium bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded-lg hover:bg-amber-500/30 transition">⏸ Pause</button>
      </div>
    </div>
  </header>

  <!-- Main -->
  <main class="max-w-7xl mx-auto px-4 py-8">

    <!-- Input Panel -->
    <section id="inputPanel" class="mb-10">
      <div class="bg-gradient-to-br from-violet-950/40 to-indigo-950/40 border border-violet-500/20 rounded-2xl p-8 shadow-2xl shadow-violet-900/10">
        <h1 class="text-3xl font-extrabold text-white mb-2">Make AI patches <span class="text-transparent bg-clip-text bg-gradient-to-r from-violet-400 to-indigo-400">compete for it</span></h1>
        <p class="text-gray-400 mb-8 text-sm">Isolated Celesto sandboxes run multiple strategies in parallel. Real tests. Real previews. Real proof.</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
          <div class="md:col-span-2">
            <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">GitHub Repository URL</label>
            <input id="repoInput" type="text" placeholder="https://github.com/owner/repo"
              class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-violet-500/60 focus:bg-white/8 transition" />
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-2 uppercase tracking-wider">Issue Number</label>
            <input id="issueInput" type="number" placeholder="42"
              class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-violet-500/60 transition" />
          </div>
        </div>

        <!-- Strategy selection -->
        <div class="mb-6">
          <label class="block text-xs font-semibold text-gray-400 mb-3 uppercase tracking-wider">Strategies</label>
          <div id="strategyPicker" class="flex flex-wrap gap-2">
            <!-- Populated by JS -->
          </div>
        </div>

        <div class="flex gap-3">
          <button id="startBtn" onclick="startRun()"
            class="px-6 py-3 bg-gradient-to-r from-violet-600 to-indigo-600 hover:from-violet-500 hover:to-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-violet-900/30 transition-all duration-200 hover:scale-105 active:scale-100 text-sm">
            ⚡ Start Arena Run
          </button>
          <button id="replayBtn" onclick="startReplay()" class="hidden px-6 py-3 bg-white/5 hover:bg-white/10 border border-white/10 text-white font-semibold rounded-xl transition text-sm">
            ▶ Replay Golden Run
          </button>
        </div>
      </div>
    </section>

    <!-- Run Info Bar -->
    <section id="runInfo" class="hidden mb-6">
      <div class="flex items-center justify-between bg-white/3 border border-white/8 rounded-xl px-5 py-3">
        <div class="flex items-center gap-4 text-sm">
          <span class="text-gray-500">Run</span>
          <code id="runIdDisplay" class="text-violet-400 font-mono text-xs bg-violet-500/10 px-2 py-0.5 rounded">—</code>
          <span id="runStatusPill" class="text-xs font-medium px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-400">starting</span>
        </div>
        <div id="globalTimer" class="text-sm text-gray-500 font-mono"></div>
      </div>
    </section>

    <!-- Candidate columns -->
    <section id="candidateGrid" class="hidden">
      <div id="candidateCols" class="grid gap-4" style="grid-template-columns: repeat(auto-fit, minmax(320px, 1fr))"></div>
    </section>

    <!-- Leaderboard -->
    <section id="leaderboard" class="hidden mt-10">
      <h2 class="text-xl font-bold text-white mb-4">🏆 Leaderboard</h2>
      <div id="leaderboardContent"></div>
      <div id="winnerBanner" class="hidden mt-6 bg-gradient-to-r from-emerald-950/60 to-teal-950/60 border border-emerald-500/30 rounded-2xl p-6">
        <div class="flex items-start justify-between">
          <div>
            <div class="text-xs font-semibold text-emerald-400 uppercase mb-1 tracking-wider">Winner 🎉</div>
            <div id="winnerName" class="text-2xl font-extrabold text-white mb-2"></div>
            <div id="winnerExplanation" class="text-gray-400 text-sm leading-relaxed"></div>
          </div>
          <div class="flex flex-col gap-2 ml-6">
            <button id="previewBtn" class="hidden px-4 py-2 text-sm font-medium bg-teal-500/20 text-teal-400 border border-teal-500/30 rounded-lg hover:bg-teal-500/30 transition" onclick="openPreview()">🔗 Live Preview</button>
            <button id="diffBtn" class="px-4 py-2 text-sm font-medium bg-white/5 text-gray-300 border border-white/10 rounded-lg hover:bg-white/10 transition" onclick="openDiff()">📄 View Diff</button>
            <button id="prBtn" class="px-4 py-2 text-sm font-medium bg-violet-500/20 text-violet-400 border border-violet-500/30 rounded-lg hover:bg-violet-500/30 transition" onclick="openPR()">🚀 Open PR</button>
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Diff Modal -->
  <div id="diffModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4" onclick="closeDiff()">
    <div class="bg-[#13151f] border border-white/10 rounded-2xl w-full max-w-4xl max-h-[80vh] overflow-hidden" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between px-5 py-4 border-b border-white/8">
        <h3 class="font-semibold text-white">Winning Diff</h3>
        <button onclick="closeDiff()" class="text-gray-500 hover:text-white text-xl">&times;</button>
      </div>
      <div class="overflow-auto max-h-[65vh] p-4">
        <pre id="diffContent" class="font-['JetBrains_Mono'] text-xs leading-5 whitespace-pre-wrap text-gray-300"></pre>
      </div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
