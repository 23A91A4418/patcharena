services:
  ledger:
    image: postgres:16
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ledger_data:/var/lib/postgresql/data
      - ./seeds:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    build: .
    environment:
      API_PORT: "8080"
      DATABASE_URL: postgresql://ledger:${POSTGRES_PASSWORD:-local-dev-only}@ledger:5432/ledger
      CELESTO_PROVIDER: ${CELESTO_PROVIDER:-cloud}
      CELESTO_API_KEY: ${CELESTO_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-2.0-flash}
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      DEMO_REPO: ${DEMO_REPO:-}
      REPLAY_MODE: "true"
      MAX_PARALLEL: "1"
    ports:
      - "8080:8080"
    depends_on:
      ledger:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  ledger_data:
