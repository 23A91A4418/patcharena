[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patcharena"
version = "0.1.0"
description = "AI patch competition on Celesto sandboxes"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
    "sse-starlette>=2.1.0",
    "python-dotenv>=1.0.0",
    "google-generativeai>=0.7.0",
    "anthropic>=0.28.0",
    "openai>=1.30.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "aiofiles>=23.2.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: marks tests as slow (integration tests)"]
[tool.hatch.build.targets.wheel]
packages = ["backend"]